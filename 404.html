<style>
:root{
  --red:#C8102E; --red-dk:#9E0C24;
  --ink:#131313; --gray-lt:#9BA0A6;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
  background:var(--ink);color:#fff;line-height:1.85;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
}
header{padding:24px 32px;border-bottom:1px solid rgba(255,255,255,.1);}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;color:#fff;}
.logo img{height:42px;width:auto;display:block;}
.logo .txt{padding-left:14px;border-left:1px solid rgba(255,255,255,.22);display:flex;flex-direction:column;line-height:1.3;}
.logo b{font-size:15px;letter-spacing:.12em;}
.logo i{font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--gray-lt);}
main{flex:1;display:flex;align-items:center;padding:64px 32px;}
.box{max-width:1200px;width:100%;margin:0 auto;}
.code{font-size:clamp(72px,14vw,160px);font-weight:800;line-height:1;color:var(--red);letter-spacing:.02em;}
h1{font-size:clamp(24px,3.2vw,36px);margin:24px 0 8px;}
p{color:var(--gray-lt);font-size:16px;}
.btns{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px;}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;text-decoration:none;
  font-size:16px;font-weight:700;letter-spacing:.04em;transition:all .28s;color:#fff;
  clip-path:polygon(0 0,100% 0,100% 74%,94% 100%,0 100%);}
.btn-red{background:var(--red);}
.btn-red:hover{background:var(--red-dk);transform:translateY(-2px);}
.btn-line{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);clip-path:none;}
.btn-line:hover{box-shadow:inset 0 0 0 1px #fff;}
@media (max-width:560px){
  header,main{padding-left:20px;padding-right:20px;}
  .btns{flex-direction:column;}
  .btn{justify-content:center;}
}
